# Data Preprocessing Configuration for OpenWebText

# Tokenizer files
vocab_filepath: data/tokenizers/bpe_owt/vocab.pkl
merges_filepath: data/tokenizers/bpe_owt/merges.pkl

# Input data paths
train_text_path: data/owt_train.txt
val_text_path: data/owt_valid.txt

# Output paths
train_output_path: data/tokenizers/bpe_owt/owt_train_tokens.npy
val_output_path: data/tokenizers/bpe_owt/owt_val_tokens.npy

# Special tokens
special_tokens:
  - '<|endoftext|>'

# Processing settings
n_workers: 8
dtype: int32
