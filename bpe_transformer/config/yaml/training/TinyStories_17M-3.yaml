# Model architecture
vocab_size: 10000
context_length: 256
d_model: 512
d_ff: 1344
num_layers: 4
num_heads: 16

# RoPE
theta: 10000

# Reproducibility
seed: 42

# Training hyperparameters
batch_size: 32
num_iterations: 43945
learning_rate_max: 0.0006
learning_rate_min: 0.00006
warmup_iterations: 4394
# warmup_iterations: 470
grad_clip_norm: 1.0
use_mixed_precision: false

# Optimizer
betas: [0.9, 0.96]
weight_decay: 0.1

# Logging and checkpointing
checkpoint_interval: 1000
val_interval: 500
log_interval: 100

# Experiment tracking
wandb_project: bpe-transformer