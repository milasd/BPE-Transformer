# Model architecture
vocab_size: 10000
context_length: 256
d_model: 512
d_ff: 1344
num_layers: 4
num_heads: 16

# RoPE
theta: 10000

# Reproducibility
seed: 42

# Training hyperparameters
batch_size: 32
num_iterations: 5000
learning_rate_max: 0.002
learning_rate_min: 0.00085
warmup_iterations: 500
grad_clip_norm: 1.0

# Optimizer
betas: [0.9, 0.96]
weight_decay: 0.01

# Logging and checkpointing
checkpoint_interval: 1000
val_interval: 500
log_interval: 100

# Experiment tracking
wandb_project: bpe-transformer
